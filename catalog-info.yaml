apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: events
  title: events
  description: Kafka event broker for parcel-dispatch
  annotations:
    backstage.io/techdocs-ref: dir:.
    contract-first-idp.github.io/scm-provider: github
    contract-first-idp.github.io/scm-host: github.com
    contract-first-idp.github.io/domain-org: contract-first-kafka
    contract-first-idp.github.io/domain-repo: kafka-ux-check-domain
    contract-first-idp.github.io/repository-name: parcel-dispatch-events-resource
  links:
    - title: Resource repository
      url: https://github.com/contract-first-kafka/parcel-dispatch-events-resource
      icon: github
spec:
  type: message-broker
  owner: group:default/domain-maintainers
  system: system:default/parcel-dispatch
  repository:
    name: parcel-dispatch-events-resource
    revision: main
  profile: kafka
  kafka:
    operator: amq-streams
    version: 4.2.0
